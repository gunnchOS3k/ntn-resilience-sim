name: CI

on:
  push:
    branches: [main, develop, 'phase-*']
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout field-kit sibling fixtures
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gunnchos-7gc-ai-ran-field-kit
          path: .deps/gunnchos-7gc-ai-ran-field-kit
          ref: main
      - name: Link field-kit beside workspace
        run: |
          set -euo pipefail
          parent="$(dirname "$GITHUB_WORKSPACE")"
          ln -sfn "$GITHUB_WORKSPACE/.deps/gunnchos-7gc-ai-ran-field-kit" "$parent/gunnchos-7gc-ai-ran-field-kit"
          test -f "$parent/gunnchos-7gc-ai-ran-field-kit/fixtures/valid/twin_state_bundle.valid.json"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Run tests
        run: PYTHONPATH=src pytest -q tests/
