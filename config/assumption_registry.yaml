version: "1.0.0"
description: >
  Non-measured scenario parameters for Gate 2 NTN resilience decisions.
  Unverified values are labeled configured or synthetic. Do not treat these as field evidence.
assumptions:
  ntn_latency_ms:
    value: 45
    unit: ms
    range: [35, 70]
    assumption_class: configured
    notes: Placeholder LEO RTT order-of-magnitude for lab scenarios; not a measured campaign result.
  ntn_capacity_mbps:
    value: 5
    unit: Mbps
    range: [1, 20]
    assumption_class: configured
    notes: Conservative configured capacity for fallback analysis.
  ntn_availability:
    value: 0.85
    unit: fraction
    range: [0.5, 0.99]
    assumption_class: configured
    notes: Configured availability fraction for sensitivity sweeps.
  handover_delay_s:
    value: 3.0
    unit: s
    range: [1.0, 10.0]
    assumption_class: configured
    notes: Configured terrestrial↔NTN handover/fallback delay.
  ntn_energy_cost_j:
    value: 25.0
    unit: J
    range: [10.0, 80.0]
    assumption_class: synthetic
    notes: Synthetic energy cost proxy for comparative ranking only.
  terrestrial_outage_duration_s:
    value: 30.0
    unit: s
    range: [5.0, 120.0]
    assumption_class: configured
    notes: Configured outage duration for recovery-time estimates when twin marks terrestrial outage.
